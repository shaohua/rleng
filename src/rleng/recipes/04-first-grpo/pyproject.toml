[project]
name = "rleng-first-grpo"
version = "1.0.0"
description = "rleng recipe 4: train a tiny model with GRPO + LoRA to make correct tool calls."
requires-python = "==3.12.*"
dependencies = [
    "accelerate==1.15.0",
    "datasets==5.1.0",
    "peft==0.21.2",
    "torch==2.14.1",
    "transformers==5.19.0",
    "trl==1.14.2",
]

[tool.uv]
package = false

# Linux: CUDA 12.6 torch wheels (work with older drivers, e.g. Colab T4). macOS: default PyPI wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
